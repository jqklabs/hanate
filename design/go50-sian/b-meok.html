<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · 먹 번짐 · 50고</title>
<link rel="stylesheet" href="sian.css">
</head>
<body class="sian-b">
  <a class="back" href="index.html">시안 목록</a>
  <button type="button" class="replay" id="replay">다시</button>
  <div class="stage" id="stage" aria-live="polite">
    <div class="sheet"></div>
    <svg class="inksvg" id="inksvg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="inkRough" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="9" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="104" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
        <filter id="inkHalo" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="23" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="9"/>
        </filter>
      </defs>
      <!-- 옅게 번진 물기 자리가 먼저, 진한 먹이 그 위에 -->
      <g id="halo" filter="url(#inkHalo)" fill="#3a2c1c" opacity=".3"></g>
      <g id="core" filter="url(#inkRough)" fill="#100c07"></g>
    </svg>
    <div class="num" id="num">50고</div>
    <div class="motes" id="motes"></div>
  </div>
  <p class="caption">B · 먹 번짐 — 먹이 퍼진 자리에 50고가 남음</p>
<script>
const SVG_NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const halo = document.getElementById('halo');
const core = document.getElementById('core');
const num = document.getElementById('num');
const motes = document.getElementById('motes');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const BLOBS = [
  { x: 600, y: 372, r: 126, del: 0 },
  { x: 468, y: 328, r: 82, del: 0.08 },
  { x: 730, y: 412, r: 90, del: 0.14 },
  { x: 544, y: 458, r: 68, del: 0.21 },
  { x: 672, y: 296, r: 62, del: 0.28 },
  { x: 398, y: 436, r: 42, del: 0.36 },
  { x: 806, y: 318, r: 38, del: 0.43 },
  { x: 620, y: 216, r: 30, del: 0.5 },
];

function circle(b, grow) {
  const el = document.createElementNS(SVG_NS, 'circle');
  el.setAttribute('cx', b.x);
  el.setAttribute('cy', b.y);
  el.setAttribute('r', b.r * grow);
  el.style.setProperty('--del', b.del + 's');
  return el;
}

function bloom() {
  halo.textContent = '';
  core.textContent = '';
  for (const b of BLOBS) {
    halo.appendChild(circle(b, 1.34));
    core.appendChild(circle(b, 1));
  }
}

function splatter(n) {
  motes.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const el = document.createElement('i');
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const dist = 210 + Math.random() * 330;
    el.style.setProperty('--x', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--y', Math.sin(ang) * dist * 0.7 + 'px');
    el.style.setProperty('--s', (3 + Math.random() * 8).toFixed(1) + 'px');
    el.style.setProperty('--c', 'rgba(16, 12, 7, .86)');
    el.style.setProperty('--dur', (0.7 + Math.random() * 0.5).toFixed(2) + 's');
    el.style.setProperty('--del', (Math.random() * 0.16).toFixed(2) + 's');
    motes.appendChild(el);
  }
}

async function play() {
  stage.className = 'stage';
  num.className = 'num';
  motes.innerHTML = '';
  bloom();
  splatter(22);
  await wait(600);

  num.classList.add('in');
  stage.classList.add('shake');
  await wait(400);
  stage.classList.remove('shake');
}

document.getElementById('replay').onclick = play;
play();
</script>
</body>
</html>
