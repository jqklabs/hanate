<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고/스톱 · 새 목표 UI 목업</title>
<style>
  @font-face {
    font-family: 'SSRockNum';
    src: url('../Assets/Fonts/SSRockRegular.woff2?v=2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
    unicode-range: U+0030-0039, U+002E, U+002C, U+002F, U+00D7, U+002B, U+2212;
  }
  @font-face {
    font-family: 'BaigeTianxing';
    src: url('../Assets/Fonts/zihun-baige-tianxing.woff2') format('woff2');
    font-weight: 400 900; font-display: swap;
  }
  :root {
    --gold: #c9a94e;
    --gold-soft: #fde68a;
    --font-ui: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --font-overlay: 'BaigeTianxing', Georgia, "Times New Roman", serif;
    --font-num: 'SSRockNum', var(--font-overlay);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-ui);
    background: #0a120d; color: #e2e8f0; line-height: 1.45;
  }
  header.page {
    padding: 20px 24px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,18,13,.94); backdrop-filter: blur(8px);
  }
  header.page h1 { margin: 0 0 6px; font-size: 18px; color: var(--gold-soft); }
  header.page p { margin: 0; font-size: 13px; color: #94a3b8; max-width: 760px; }
  .ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .ctrl label { font-size: 12px; color: #64748b; font-weight: 700; margin-right: 4px; }
  .ctrl button {
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.25);
    color: #cbd5e1; font: inherit; font-size: 12px; font-weight: 700;
  }
  .ctrl button.on { border-color: rgba(253,230,138,.5); color: var(--gold-soft); background: rgba(201,169,78,.15); }
  main { padding: 20px 24px 56px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px; align-items: start;
  }
  .card-wrap {}
  .card-label {
    font-size: 13px; font-weight: 800; color: var(--gold-soft);
    margin-bottom: 4px;
  }
  .card-desc {
    font-size: 12px; color: #64748b; margin-bottom: 10px; min-height: 34px;
  }
  .card-desc b { color: #94a3b8; }
  .rec { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: rgba(201,169,78,.22); color: var(--gold-soft); font-size: 10px; vertical-align: middle; }

  /* ── 공통 모달 ── */
  .scene {
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, #143322, #0f2418);
    border: 1px solid rgba(255,255,255,.08);
    padding: 20px 14px;
  }
  .modal {
    background: linear-gradient(170deg, #1f3d2b, #142a1d);
    border: 1.5px solid var(--gold); border-radius: 16px;
    padding: 26px 24px 22px; max-width: 480px; margin: 0 auto;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  .gs-head-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 0;
  }
  .gs-head-row h2 {
    margin: 0; flex: 1; min-width: 0;
    font-family: var(--font-overlay); font-weight: 400;
    font-size: 19px; color: var(--gold-soft);
  }
  .deck-pill {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 10px; border-radius: 999px;
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14);
    font-size: 13px; font-weight: 800; color: #e2e8f0;
  }
  .deck-pill b { color: var(--gold-soft); }
  .modal-actions {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .choicebtn {
    flex: 1; min-width: 0; padding: 22px 16px; border-radius: 12px;
    border: none; text-align: center; cursor: default;
    font-family: var(--font-overlay); font-weight: 400;
  }
  .choicebtn .t { font-size: 34px; letter-spacing: .06em; color: #fff; }
  .choicebtn .sub-t {
    display: block; margin-top: 6px;
    font-family: var(--font-ui); font-size: 11px; font-weight: 700;
    opacity: .82; letter-spacing: 0;
  }
  .btn-stop { background: linear-gradient(180deg, #16a34a, #15803d); }
  .btn-go { background: linear-gradient(180deg, #dc2626, #991b1b); }

  /* ── 현재 (baseline) ── */
  .v-now .gs-next-target {
    text-align: center; margin: 10px 0 18px; padding: 16px 12px 14px;
    border-radius: 14px; background: rgba(0,0,0,.24);
    border: 1px solid rgba(201,169,78,.28);
  }
  .v-now .gs-next-label { font-size: 12px; font-weight: 800; color: #94a3b8; }
  .v-now .gs-next-jump { margin-top: 6px; font-size: 12px; font-weight: 800; color: #fde68a; }
  .v-now .gs-next-score {
    margin-top: 4px; font-family: var(--font-num); font-size: 50px; line-height: 1;
    color: var(--gold-soft);
  }
  .v-now .gs-next-unit { font-family: var(--font-overlay); font-size: 24px; margin-left: 2px; }
  .v-now .gs-next-meta { margin-top: 8px; font-size: 13px; font-weight: 700; color: #cbd5e1; }
  .v-now .gs-next-meta b { color: #fde68a; }

  /* A · 맨타입 — 박스·메타 없음 */
  .v-a .gs-hero { text-align: center; margin: 14px 0 22px; padding: 0 4px; }
  .v-a .gs-hero-label {
    font-size: 11px; font-weight: 800; color: #64748b; letter-spacing: .12em;
  }
  .v-a .gs-hero-score {
    margin-top: 2px; font-family: var(--font-num); font-size: 58px; line-height: 1.05;
    color: var(--gold-soft); text-shadow: 0 2px 18px rgba(201,169,78,.22);
  }
  .v-a .gs-hero-unit { font-family: var(--font-overlay); font-size: 28px; margin-left: 1px; }

  /* B · 구분선 — 얇은 룰만 */
  .v-b .gs-hero { margin: 12px 0 20px; }
  .v-b .gs-rule {
    height: 1px; margin: 0 8px 14px;
    background: linear-gradient(90deg, transparent, rgba(201,169,78,.45), transparent);
  }
  .v-b .gs-hero-inner { text-align: center; }
  .v-b .gs-hero-label { font-size: 12px; font-weight: 700; color: #94a3b8; }
  .v-b .gs-hero-score {
    font-family: var(--font-num); font-size: 54px; line-height: 1.08;
    color: #fff; margin-top: 2px;
  }
  .v-b .gs-hero-unit { font-family: var(--font-overlay); font-size: 26px; color: var(--gold-soft); }

  /* C · 좌측 정렬 — 점수판 톤 */
  .v-c .gs-hero {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin: 16px 0 22px; padding: 0 2px;
  }
  .v-c .gs-hero-label {
    font-size: 14px; font-weight: 800; color: #94a3b8; white-space: nowrap;
  }
  .v-c .gs-hero-score {
    font-family: var(--font-num); font-size: 48px; line-height: 1;
    color: var(--gold-soft); text-align: right;
  }
  .v-c .gs-hero-unit { font-family: var(--font-overlay); font-size: 22px; }

  /* D · Go 버튼에 목표 내장 */
  .v-d .gs-hero { text-align: center; margin: 8px 0 6px; }
  .v-d .gs-hero-label { font-size: 12px; font-weight: 700; color: #64748b; }
  .v-d .modal-actions { margin-top: 14px; }
  .v-d .btn-go .t { font-size: 30px; line-height: 1.15; }
  .v-d .btn-go .go-target {
    display: block; font-family: var(--font-num); font-size: 22px;
    color: #fecaca; margin-top: 4px; letter-spacing: .02em;
  }
  .v-d .btn-go .go-target small {
    font-family: var(--font-overlay); font-size: 14px; opacity: .9;
  }

  /* E · 한 줄 헤더 병합 */
  .v-e .gs-head-row { align-items: center; margin-bottom: 18px; }
  .v-e .gs-head-row h2 { font-size: 17px; }
  .v-e .gs-inline-target {
    text-align: center; margin-bottom: 4px;
  }
  .v-e .gs-inline-target .lbl {
    display: block; font-size: 11px; font-weight: 800; color: #64748b;
    letter-spacing: .08em; margin-bottom: 2px;
  }
  .v-e .gs-inline-target .num {
    font-family: var(--font-num); font-size: 56px; line-height: 1;
    color: var(--gold-soft);
  }
  .v-e .gs-inline-target .unit { font-family: var(--font-overlay); font-size: 26px; }

  /* F · 얇은 글로우 필드 (박스 대신) */
  .v-f .gs-hero {
    text-align: center; margin: 12px 0 20px; padding: 20px 8px 18px;
    border-radius: 12px;
    background: radial-gradient(ellipse 70% 80% at 50% 55%, rgba(201,169,78,.12), transparent 70%);
  }
  .v-f .gs-hero-label { font-size: 11px; font-weight: 800; color: #64748b; letter-spacing: .1em; }
  .v-f .gs-hero-score {
    font-family: var(--font-num); font-size: 60px; line-height: 1;
    color: #fff;
  }
  .v-f .gs-hero-unit {
    font-family: var(--font-overlay); font-size: 28px;
    color: var(--gold-soft); opacity: .95;
  }

  .jump-badge {
    display: none; margin: 0 auto 8px; width: fit-content;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 800; color: #fde68a;
    background: rgba(253,230,138,.1); border: 1px solid rgba(253,230,138,.25);
  }
  body.show-jump .jump-badge { display: block; }
  body.show-jump .go-label-jump { display: inline; }
  .go-label-jump { display: none; }
</style>
</head>
<body class="show-jump">

<header class="page">
  <h1>고/스톱 · 새 목표 UI 목업</h1>
  <p>공통: <b>새 목표 + 점수</b>만 본문에. ×배수·냥·밀치기는 hover/버튼 쪽으로 빼는 방향.</p>
  <div class="ctrl">
    <span><label>케이스</label></span>
    <button type="button" class="on" data-case="jump">2단계 밀치기 · 352점</button>
    <button type="button" data-case="simple">1고 · 256점</button>
  </div>
</header>

<main>
<div class="grid" id="grid"></div>
</main>

<script>
const CASES = {
  jump: { score: 352, goLabel: '2고', goSub: '×2.2 · +2냥', jump: '2단계 밀치기', deck: 37 },
  simple: { score: 256, goLabel: '1고', goSub: '×1.6 · +1냥', jump: '', deck: 40 },
};

const VARIANTS = [
  {
    id: 'now', name: '현재 (비교용)', rec: false,
    desc: '박스 + 라벨 + 밀치기 + 메타 한꺼번에. 정보는 많은데 답답함.',
    html: (c) => `
      <div class="gs-next-target">
        <div class="gs-next-label">고 시 새 목표</div>
        ${c.jump ? `<div class="gs-next-jump jump-badge" style="display:block;margin:6px auto 0">${c.jump}</div>` : ''}
        <div class="gs-next-score">${c.score}<span class="gs-next-unit">점</span></div>
        <div class="gs-next-meta">×2.2 · 성공 시 <b>+2냥</b></div>
      </div>`,
  },
  {
    id: 'a', name: 'A · 맨타입', rec: true,
    desc: '박스·메타 전부 제거. 숫자만 크게. 밀치기/보너스는 버튼 hover.',
    html: (c) => `
      <div class="gs-hero">
        <div class="gs-hero-label">고 시 새 목표</div>
        <div class="gs-hero-score">${c.score}<span class="gs-hero-unit">점</span></div>
      </div>`,
  },
  {
    id: 'b', name: 'B · 구분선', rec: false,
    desc: '얇은 gold rule로 섹션만 나눔. 박스 느낌 없이 정돈.',
    html: (c) => `
      <div class="gs-hero">
        <div class="gs-rule"></div>
        <div class="gs-hero-inner">
          <div class="gs-hero-label">고 시 새 목표</div>
          <div class="gs-hero-score">${c.score}<span class="gs-hero-unit">점</span></div>
        </div>
      </div>`,
  },
  {
    id: 'c', name: 'C · 좌우 정렬', rec: false,
    desc: '점수판 statline처럼 라벨↔숫자 양끝. 컴팩트.',
    html: (c) => `
      <div class="gs-hero">
        <div class="gs-hero-label">고 시<br>새 목표</div>
        <div class="gs-hero-score">${c.score}<span class="gs-hero-unit">점</span></div>
      </div>`,
  },
  {
    id: 'd', name: 'D · Go 버튼 내장', rec: true,
    desc: '본문은 라벨만. 목표 점수는 빨간 Go 버튼 안에 — “고 = 이 점수”.',
    html: (c) => `
      <div class="gs-hero"><div class="gs-hero-label">한 번 더 갈까요?</div></div>`,
    actions: (c) => `
      <button class="choicebtn btn-stop"><div class="t">스톱</div></button>
      <button class="choicebtn btn-go">
        <div class="t">${c.goLabel}<span class="go-label-jump"> · ${c.jump}</span></div>
        <span class="go-target">${c.score}<small>점</small></span>
        <span class="sub-t">${c.goSub} · hover 상세</span>
      </button>`,
  },
  {
    id: 'e', name: 'E · 타이틀 아래 집중', rec: false,
    desc: '“목표 달성!” 바로 아래 숫자만. 헤더·점수가 한 덩어리.',
    html: (c) => `
      <div class="gs-inline-target">
        <span class="lbl">고 시 새 목표</span>
        <span class="num">${c.score}</span><span class="unit">점</span>
      </div>`,
    headTweak: true,
  },
  {
    id: 'f', name: 'F · 글로우 필드', rec: false,
    desc: '테두리 박스 대신 은은한 radial glow. 숫자는 흰색.',
    html: (c) => `
      <div class="gs-hero">
        <div class="gs-hero-label">고 시 새 목표</div>
        <div class="gs-hero-score">${c.score}<span class="gs-hero-unit">점</span></div>
      </div>`,
  },
];

function render(caseKey) {
  const c = CASES[caseKey];
  document.body.classList.toggle('show-jump', !!c.jump);
  document.getElementById('grid').innerHTML = VARIANTS.map((v) => {
    const actions = v.actions ? v.actions(c) : `
      <button class="choicebtn btn-stop"><div class="t">스톱</div></button>
      <button class="choicebtn btn-go">
        <div class="t">${c.goLabel}</div>
        <span class="sub-t">${c.goSub} · hover</span>
      </button>`;
    const jumpBadge = c.jump && v.id !== 'now' && v.id !== 'd'
      ? `<div class="jump-badge">${c.jump}</div>` : '';
    const head = v.headTweak
      ? `<div class="gs-head-row"><h2>🎉 목표 달성!</h2><div class="deck-pill">🂠 <b>${c.deck}</b></div></div>`
      : `<div class="gs-head-row"><h2>🎉 목표 달성!</h2><div class="deck-pill">🂠 <b>${c.deck}</b></div></div>`;
    return `
      <div class="card-wrap v-${v.id}">
        <div class="card-label">${v.name}${v.rec ? '<span class="rec">후보</span>' : ''}</div>
        <div class="card-desc"><b>${v.desc.split('.')[0]}.</b> ${v.desc.split('.').slice(1).join('.').trim()}</div>
        <div class="scene">
          <div class="modal">
            ${head}
            ${jumpBadge}
            ${v.html(c)}
            <div class="modal-actions">${actions}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('[data-case]').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-case]').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    render(btn.dataset.case);
  });
});

render('jump');
</script>
</body>
</html>
